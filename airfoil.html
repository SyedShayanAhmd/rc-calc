<!DOCTYPE html>
<html><head><link rel="stylesheet" href="style.css"></head><body>
    <div class="nav">
        <a href="index.html">1. Sizer</a><a href="airfoil.html" class="active">2. Airfoil</a>
        <a href="electronics.html">3. Electronics</a><a href="cg.html">4. CG Analysis</a>
        <a href="gear.html">5. Landing Gear</a><a href="viewer.html">6. 3D Viewer</a>
    </div>
    <div class="grid"><div class="panel">
        <label>Profile (e.g. 2412, 0012, clarky)</label><input type="text" id="naca" value="2412" oninput="calc()">
        <label>Angle of Attack (deg)</label><input type="number" id="alpha" value="2" oninput="calc()">
        <label>Airspeed (m/s)</label><input type="number" id="v" value="15" oninput="calc()">
        <label>Chord (m)</label><input type="number" id="c" value="0.2" oninput="calc()">
        <canvas id="cvs" height="150"></canvas>
    </div>
    <div class="panel"><div class="stat-grid" id="out"></div></div></div>
    <script>
        function calc() {
            let code = document.getElementById('naca').value.toLowerCase();
            let a = parseFloat(document.getElementById('alpha').value);
            let v = parseFloat(document.getElementById('v').value);
            let c = parseFloat(document.getElementById('c').value);
            
            let m=0, p=0, t=0.12;
            if(code === 'clarky') { m=0.034; p=0.3; t=0.117; } 
            else if(!isNaN(code) && code.length===4) { m=parseInt(code[0])/100; p=parseInt(code[1])/10; t=parseInt(code.substr(2,2))/100; }
            
            let alphaRad = a * (Math.PI/180);
            let a0 = -m * 100; // Thin airfoil zero-lift approx
            let cl = 2 * Math.PI * (alphaRad - (a0*Math.PI/180));
            let cd0 = 0.006 + Math.pow(t, 2);
            let cdi = Math.pow(cl, 2) / (Math.PI * 6 * 0.8); // Assumed AR=6, e=0.8
            let cd = cd0 + cdi;
            let re = (1.225 * v * c) / 1.81e-5;
            let q = 0.5 * 1.225 * v * v;
            
            let stats = {
                "Max Camber": (m*100).toFixed(1)+"%", "Camber Pos": (p*100).toFixed(1)+"%", "Thickness": (t*100).toFixed(1)+"%",
                "Zero Lift Angle (a0)": a0.toFixed(1)+"°", "Lift Coef (Cl)": cl.toFixed(3), "Drag Coef (Cd)": cd.toFixed(4),
                "L/D Ratio": (cl/cd).toFixed(1), "Pitch Moment (Cm)": (-Math.PI/2 * m).toFixed(3), "Ideal Alpha": (p*50).toFixed(1)+"°",
                "Reynolds Number": re.toExponential(2), "Stagnation Pt x/c": (Math.pow(a/15, 2)*0.05).toFixed(3), "Stall Angle (Est)": (12 + t*100).toFixed(1)+"°",
                "Lift Force/Span": (q*c*cl).toFixed(1)+" N/m", "Drag Force/Span": (q*c*cd).toFixed(1)+" N/m", "L.E. Radius": (1.1019*t*t).toFixed(4),
                "Mach Crit (Est)": (0.8 - t).toFixed(2), "Profile Drag (Cd0)": cd0.toFixed(4), "Induced Drag (Cdi)": cdi.toFixed(4),
                "Flow Transition": re>5e5?"Turbulent":"Laminar", "T.E. Angle": (Math.atan(t)*180/Math.PI).toFixed(1)+"°"
            };
            
            document.getElementById('out').innerHTML = Object.entries(stats).map(([k,v]) => `<div class="stat-box">${k}<span>${v}</span></div>`).join('');
            
            // Draw
            let ctx = document.getElementById('cvs').getContext('2d');
            ctx.clearRect(0,0,300,150); ctx.beginPath(); ctx.moveTo(0,75);
            for(let i=0; i<=100; i++) {
                let x = i/100, yt = 5*t*(0.2969*Math.sqrt(x)-0.1260*x-0.3516*x*x+0.2843*Math.pow(x,3)-0.1015*Math.pow(x,4));
                ctx.lineTo(x*280 + 10, 75 - yt*280);
            }
            ctx.stroke();
        } calc();
    </script>
</body></html>
