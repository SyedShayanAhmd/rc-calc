<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>RC Suite — CG</title><link rel="stylesheet" href="style.css"></head><body>
    <div class="nav"><a href="index.html">1. Sizer</a><a href="airfoil.html">2. Airfoil</a><a href="electronics.html">3. Electronics</a><a href="cg.html" class="active">4. CG</a><a href="gear.html">5. Gear</a><a href="viewer.html">6. 3D</a><a href="help.html">? Help</a></div>
    <div class="grid"><div class="panel">
        <h3>Weights & Moments <span class="cite" tabindex="0" data-note="Datum (0mm) is the absolute nose tip.">i</span></h3>
        <table id="cgTbl"><tr><th>Component</th><th>W (g)</th><th>Dist (mm)</th><th>Mom (g·mm)</th><th></th></tr></table>
        <button onclick="add()">+ Add Component</button>
        <div class="stat-grid" style="margin-top:16px;">
            <div class="stat-box"><span class="stat-label">Total W</span><span class="stat-val" id="tw">0</span></div>
            <div class="stat-box"><span class="stat-label">Total Mom</span><span class="stat-val" id="tm">0</span></div>
            <div class="stat-box"><span class="stat-label">CG</span><span class="stat-val" id="cg">0</span></div>
        </div>
    </div>
    <div class="panel">
        <h3>2D Analysis Plot <span class="cite" tabindex="0" data-note="Neutral Point ≈ Wing LE + 25% MAC (Thin Airfoil Theory approximation for unswept wings).">i</span></h3>
        <label>Wing LE Dist from Nose (mm)</label><input type="number" id="wingLE" oninput="draw()">
        <canvas id="cgPlot" height="200" style="margin-top:20px;"></canvas>
    </div></div>
    <script src="state.js"></script><script>
        const st = RCState.get(); let comps = st.components;
        document.getElementById('wingLE').value = st.wingLEPosition_mm;

        function tableRows() {
            const t = document.getElementById('cgTbl'); while(t.rows.length>1) t.deleteRow(1);
            let tw=0, tm=0;
            comps.forEach((c,i) => {
                let m = c.w*c.d; tw+=c.w; tm+=m;
                t.insertRow(-1).innerHTML = `<td><input value="${c.n}" oninput="comps[${i}].n=this.value"></td><td><input type="number" value="${c.w}" oninput="comps[${i}].w=Number(this.value); draw()"></td><td><input type="number" value="${c.d}" oninput="comps[${i}].d=Number(this.value); draw()"></td><td>${m}</td><td><button class="danger-btn" onclick="comps.splice(${i},1); draw()">×</button></td>`;
            }); return {tw, tm};
        }
        function draw() {
            const {tw, tm} = tableRows(); const cg = tw>0 ? tm/tw : 0;
            document.getElementById('tw').innerText = tw+' g'; document.getElementById('tm').innerText = tm; document.getElementById('cg').innerText = cg.toFixed(1)+' mm';
            const wingLE = Number(document.getElementById('wingLE').value);
            const rC = (RCState.get().rootChord_cm||25)*10, tC = (RCState.get().tipChord_cm||15)*10, fL = (RCState.get().fuseLength_cm||85)*10;
            const lambda = tC/rC; const mac = (2/3)*rC*(1+lambda+lambda*lambda)/(1+lambda);
            const np = wingLE + 0.25*mac;

            const ctx = document.getElementById('cgPlot').getContext('2d'); ctx.clearRect(0,0,760,200);
            const sc = 720 / Math.max(fL, 1), Y = 100, px = (mm) => 20 + mm*sc;

            // Fuselage
            ctx.strokeStyle = '#5b6980'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(px(0),Y); ctx.lineTo(px(fL),Y); ctx.stroke();
            // Wing Block
            ctx.fillStyle = 'rgba(91,157,217,0.3)'; ctx.fillRect(px(wingLE), Y-20, mac*sc, 40);
            ctx.fillStyle = '#5b9dd9'; ctx.fillText('MAC', px(wingLE), Y-25);
            
            function mark(mm, col, lbl, dy) { ctx.fillStyle=col; ctx.beginPath(); ctx.arc(px(mm),Y,6,0,7); ctx.fill(); ctx.fillText(lbl, px(mm)-10, Y+dy); }
            mark(0, '#93a2b8', 'NOSE', 20); mark(np, '#3ddbc4', 'NP', 20); mark(cg, '#ff7a1a', 'CG', -15);
            
            RCState.set({components: comps, wingLEPosition_mm: wingLE, cgPosition_mm: cg});
        }
        function add() { comps.push({n:'New', w:0, d:0}); draw(); } draw();
    </script>
</body></html>
