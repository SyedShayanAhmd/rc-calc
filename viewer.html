<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>RC Suite — 3D Viewer</title><link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script></head><body>
    <div class="nav"><a href="index.html">1. Sizer</a><a href="airfoil.html">2. Airfoil</a><a href="electronics.html">3. Electronics</a><a href="cg.html">4. CG</a><a href="gear.html">5. Gear</a><a href="viewer.html" class="active">6. 3D</a><a href="help.html">? Help</a></div>
    <div class="panel tick">
        <div id="3d-container" style="height: 540px; width: 100%;"></div>
    </div>
    <script src="state.js"></script><script>
        const container = document.getElementById('3d-container');
        const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1c2a39); // NX Blue
        const camera = new THREE.PerspectiveCamera(50, container.clientWidth/540, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({antialias:true});
        renderer.setSize(container.clientWidth, 540); container.appendChild(renderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        const light = new THREE.DirectionalLight(0xffffff, 1); light.position.set(10, 20, 10); scene.add(light);
        scene.add(new THREE.AmbientLight(0x556677));
        const grid = new THREE.GridHelper(50, 50, 0x445566, 0x223344); scene.add(grid);

        let group = new THREE.Group(); scene.add(group);

        function getNACAShape(code, rootC) {
            const shape = new THREE.Shape();
            let m=parseInt(code[0])/100, p=parseInt(code[1])/10, t=parseInt(code.substr(2,2))/100;
            if(code==='clarky'){ m=0.034; p=0.3; t=0.117; } if(p===0) p=0.4;
            
            for(let i=0; i<=100; i++) {
                const x = i/100, yc = x<p ? (m/(p*p))*(2*p*x-x*x) : (m/Math.pow(1-p,2))*((1-2*p)+2*p*x-x*x);
                const yt = 5*t*(0.2969*Math.sqrt(x)-0.1260*x-0.3516*x*x+0.2843*Math.pow(x,3)-0.1015*Math.pow(x,4));
                shape.lineTo(x*rootC, yc*rootC + yt*rootC);
            }
            for(let i=100; i>=0; i--) {
                const x = i/100, yc = x<p ? (m/(p*p))*(2*p*x-x*x) : (m/Math.pow(1-p,2))*((1-2*p)+2*p*x-x*x);
                const yt = 5*t*(0.2969*Math.sqrt(x)-0.1260*x-0.3516*x*x+0.2843*Math.pow(x,3)-0.1015*Math.pow(x,4));
                shape.lineTo(x*rootC, yc*rootC - yt*rootC);
            }
            return shape;
        }

        function createTaperedExtrusion(shape, spanHalf, taper) {
            const geo = new THREE.ExtrudeGeometry(shape, { depth: spanHalf, bevelEnabled: false, steps: 1 });
            const pos = geo.attributes.position;
            for(let i=0; i<pos.count; i++) {
                const z = pos.getZ(i), scale = 1 - (1 - taper) * (z / spanHalf);
                pos.setX(i, pos.getX(i)*scale); pos.setY(i, pos.getY(i)*scale);
            }
            geo.computeVertexNormals(); return geo;
        }

        function build() {
            while(group.children.length) group.remove(group.children[0]);
            const st = RCState.get();
            const fL = st.fuseLength_cm/10, fH = st.fuseHeight_cm/10, spanHalf = (st.span_cm/10)/2;
            const rC = st.rootChord_cm/10, taper = st.taperRatio, le = st.wingLEPosition_mm/100;
            const hsSpanHalf = (st.hsSpan_cm/10)/2, hsC = st.hsChord_cm/10, vsH = st.vsHeight_cm/10, vsC = st.vsChord_cm/10;

            const mat = new THREE.MeshPhongMaterial({color: 0xff7a1a, flatShading: false});
            const matF = new THREE.MeshPhongMaterial({color: 0x99aabb, transparent: true, opacity: 0.8});
            
            // Fuselage (0 is nose)
            const fuse = new THREE.Mesh(new THREE.BoxGeometry(fH, fH, fL), matF);
            fuse.position.set(0, fH, fL/2); group.add(fuse);

            // Wing (Parametric NACA + Taper)
            const shape = getNACAShape(st.airfoilCode || '2412', rC);
            const rWing = new THREE.Mesh(createTaperedExtrusion(shape, spanHalf, taper), mat);
            rWing.rotation.y = -Math.PI/2; rWing.position.set(0, fH*1.5, le); group.add(rWing);
            const lWing = new THREE.Mesh(createTaperedExtrusion(shape, spanHalf, taper), mat);
            lWing.rotation.y = Math.PI/2; lWing.position.set(0, fH*1.5, le); group.add(lWing);

            // Empennage
            const hsShape = getNACAShape('0012', hsC);
            const rHS = new THREE.Mesh(createTaperedExtrusion(hsShape, hsSpanHalf, 1.0), mat);
            rHS.rotation.y = -Math.PI/2; rHS.position.set(0, fH, fL - hsC); group.add(rHS);
            const lHS = new THREE.Mesh(createTaperedExtrusion(hsShape, hsSpanHalf, 1.0), mat);
            lHS.rotation.y = Math.PI/2; lHS.position.set(0, fH, fL - hsC); group.add(lHS);
            
            const vsShape = getNACAShape('0012', vsC);
            const vs = new THREE.Mesh(createTaperedExtrusion(vsShape, vsH, 0.6), mat);
            vs.rotation.x = -Math.PI/2; vs.rotation.z = Math.PI/2; vs.position.set(0, fH, fL - vsC); group.add(vs);

            // CG Marker
            const cg = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), new THREE.MeshBasicMaterial({color: 0xff2f2f}));
            cg.position.set(0, fH, st.cgPosition_mm/100); group.add(cg);

            controls.target.set(0, fH, fL/2); camera.position.set(15, 15, -15);
        }
        build(); RCState.onChange(build);
        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); } animate();
    </script>
</body></html>
