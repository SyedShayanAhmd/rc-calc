<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>RC Sizing Suite — 6. 3D Viewer</title><link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script></head><body>
    <div class="suite-header">
        <div class="suite-title"><span class="mark"></span>RC SIZING &amp; ANALYSIS SUITE</div>
        <div class="suite-sub">CLIENT-SIDE · NO SERVER · LOCALSTORAGE STATE</div>
    </div>
    <div class="nav">
        <a href="index.html"><span class="n">1</span>Sizer</a><a href="airfoil.html"><span class="n">2</span>Airfoil</a>
        <a href="electronics.html"><span class="n">3</span>Electronics</a><a href="cg.html"><span class="n">4</span>CG Analysis</a>
        <a href="gear.html"><span class="n">5</span>Landing Gear</a><a href="viewer.html" class="active"><span class="n">6</span>3D Viewer</a>
        <a href="help.html"><span class="n">?</span>Get Started</a>
    </div>

    <div class="sync-flag"><span class="dot"></span>Fully parametric — span, chord, fuselage length and the CG marker are read live from state. Drag to orbit, scroll to zoom.</div>

    <div class="panel tick">
        <div id="3d-container" style="height: 540px; width: 100%;"></div>
        <div class="stat-grid" id="v_out" style="margin-top:16px;"></div>
    </div>

    <script src="state.js"></script>
    <script>
        const container = document.getElementById('3d-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0e1217);
        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / 540, 0.01, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, 540);
        renderer.setPixelRatio(window.devicePixelRatio || 1);
        container.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.1);
        light.position.set(3, 6, 4); scene.add(light);
        scene.add(new THREE.AmbientLight(0x8899aa, 0.6));

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.08;

        let modelGroup = new THREE.Group();
        scene.add(modelGroup);

        function clearModel() {
            while (modelGroup.children.length) {
                const obj = modelGroup.children.pop();
                obj.geometry && obj.geometry.dispose();
                obj.material && obj.material.dispose();
            }
        }

        /* ---------------------------------------------------------------
           Builds a fully parametric airframe from the shared RCState:
             - fuselage length     <- CG tab (fuselageLength_mm)
             - wingspan / chords   <- Sizer tab (span_cm, rootChord_cm, tipChord_cm)
             - wing LE position    <- CG tab (wingLEPosition_mm)
             - CG marker position  <- CG tab (cgPosition_mm)
           Coordinate convention: nose datum at z=0, +z runs aft toward the
           tail, matching the "distance from nose" convention used in CG
           Analysis and Landing Gear so all three tabs describe one aircraft.
           Units: meters (converted from the cm/mm stored in state).
           --------------------------------------------------------------- */
        function buildModel(st) {
            clearModel();

            const fuseLen = (st.fuselageLength_mm || 900) / 1000;
            const span = (st.span_cm || 122) / 100;
            const rootC = (st.rootChord_cm || 25) / 100;
            const tipC = (st.tipChord_cm || 15) / 100;
            const avgC = (rootC + tipC) / 2;
            const wingLE = (st.wingLEPosition_mm || Math.round(fuseLen * 1000 * 0.33)) / 1000;
            const cgPos = (st.cgPosition_mm != null ? st.cgPosition_mm : fuseLen * 500) / 1000;

            const fuseW = Math.max(0.06, rootC * 0.35);
            const fuseH = fuseW * 1.1;

            // Fuselage: spans z=0 (nose) to z=fuseLen (tail)
            const fuse = new THREE.Mesh(
                new THREE.BoxGeometry(fuseW, fuseH, fuseLen),
                new THREE.MeshPhongMaterial({ color: 0xb9c2cf })
            );
            fuse.position.set(0, 0, fuseLen / 2);
            modelGroup.add(fuse);

            // Main wing, positioned by its leading edge (wingLE) along z
            const wing = new THREE.Mesh(
                new THREE.BoxGeometry(span, avgC * 0.08, avgC),
                new THREE.MeshPhongMaterial({ color: 0xff7a1a })
            );
            wing.position.set(0, fuseH * 0.15, wingLE + avgC / 2);
            modelGroup.add(wing);

            // Horizontal stabilizer near the tail
            const hstabSpan = span * 0.35, hstabChord = rootC * 0.55;
            const hstab = new THREE.Mesh(
                new THREE.BoxGeometry(hstabSpan, avgC * 0.06, hstabChord),
                new THREE.MeshPhongMaterial({ color: 0x5b9dd9 })
            );
            hstab.position.set(0, fuseH * 0.15, fuseLen - hstabChord * 0.7);
            modelGroup.add(hstab);

            // Vertical stabilizer
            const vstabHeight = fuseH * 2.2, vstabChord = hstabChord * 0.9;
            const vstab = new THREE.Mesh(
                new THREE.BoxGeometry(avgC * 0.05, vstabHeight, vstabChord),
                new THREE.MeshPhongMaterial({ color: 0x5b9dd9 })
            );
            vstab.position.set(0, fuseH / 2 + vstabHeight / 2, fuseLen - vstabChord * 0.7);
            modelGroup.add(vstab);

            // Motor at the nose (tractor configuration)
            const motor = new THREE.Mesh(
                new THREE.CylinderGeometry(fuseW * 0.55, fuseW * 0.55, fuseW * 0.6, 24),
                new THREE.MeshPhongMaterial({ color: 0x222831 })
            );
            motor.rotation.x = Math.PI / 2;
            motor.position.set(0, 0, -fuseW * 0.3);
            modelGroup.add(motor);

            // --- CG marker: updates live from cg.html ---
            const cgMarker = new THREE.Mesh(
                new THREE.SphereGeometry(Math.max(0.012, fuseW * 0.22), 16, 16),
                new THREE.MeshPhongMaterial({ color: 0xff2f2f, emissive: 0x330000 })
            );
            cgMarker.position.set(0, fuseH * 0.9, cgPos);
            modelGroup.add(cgMarker);
            const cgRod = new THREE.Mesh(
                new THREE.CylinderGeometry(0.004, 0.004, fuseH * 1.6, 8),
                new THREE.MeshPhongMaterial({ color: 0xff2f2f })
            );
            cgRod.position.set(0, fuseH * 0.1, cgPos);
            modelGroup.add(cgRod);

            // Frame camera / controls target on the model
            const maxDim = Math.max(span, fuseLen);
            controls.target.set(0, 0, fuseLen / 2);
            camera.position.set(maxDim * 0.65, maxDim * 0.5, -maxDim * 0.75 + fuseLen / 2);
            camera.far = maxDim * 20; camera.updateProjectionMatrix();
            controls.update();

            RCState.renderStats(document.getElementById('v_out'), {
                'Wingspan': span.toFixed(2) + ' m',
                'Root / Tip Chord': rootC.toFixed(2) + ' / ' + tipC.toFixed(2) + ' m',
                'Fuselage Length': fuseLen.toFixed(2) + ' m',
                'CG (from nose)': (cgPos * 1000).toFixed(0) + ' mm'
            });
        }

        // Grid helper — ground reference plane
        function addGrid(st) {
            const size = Math.max((st.span_cm || 122) / 100, (st.fuselageLength_mm || 900) / 1000) * 1.8;
            const grid = new THREE.GridHelper(size, 20, 0x3c4a60, 0x212a37);
            grid.position.y = -(((st.rootChord_cm || 25) / 100) * 0.35 * 1.1) / 2 - 0.02;
            scene.add(grid);
        }

        const initialState = RCState.get();
        addGrid(initialState);
        buildModel(initialState);

        // Live sync: rebuild the model whenever any other tab updates state.
        RCState.onChange((s) => buildModel(s));

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / 540;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, 540);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body></html>
