<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>RC Suite — Sizer</title><link rel="stylesheet" href="style.css"></head><body>
    <div class="nav"><a href="index.html" class="active">1. Sizer</a><a href="airfoil.html">2. Airfoil</a><a href="electronics.html">3. Electronics</a><a href="cg.html">4. CG</a><a href="gear.html">5. Gear</a><a href="viewer.html">6. 3D</a><a href="help.html">? Help</a></div>
    <div class="grid">
        <div class="panel">
            <h3>Aircraft Sizing Calculator</h3>
            <label>Enter the desired MTOW in grams:</label>
            <input type="number" id="w" oninput="c()">
            
            <label>Enter the desired wing cubical loading:</label>
            <input type="number" id="wcl" oninput="c()">
            
            <label>Enter the desired aspect ratio:</label>
            <input type="number" id="ar" oninput="c()">
            
            <label>Enter Taper Ratio (1.0 = Rectangular):</label>
            <input type="number" id="tr" step="0.05" oninput="c()">
        </div>
        <div class="panel">
            <h3>Geometry Outputs</h3>
            <div class="stat-grid" id="out" style="grid-template-columns: repeat(2, 1fr);"></div>
        </div>
    </div>
    
    <script src="state.js"></script><script>
        const st = RCState.get();
        document.getElementById('w').value = st.weight_g || 1500;
        document.getElementById('wcl').value = st.wingCubicLoading || 7;
        document.getElementById('ar').value = st.aspectRatio || 6;
        document.getElementById('tr').value = st.taperRatio || 1.0;
        
        function c() {
            const w_g = Number(document.getElementById('w').value);
            const wcl = Number(document.getElementById('wcl').value);
            const ar = Number(document.getElementById('ar').value);
            const taperRatio = Number(document.getElementById('tr').value);

            const w_oz = w_g * 0.03527396195;
            
            const area_sqft = Math.pow(w_oz / wcl, 2/3);
            const wing_area_sqin = area_sqft * 144;
            const wing_span_in = Math.sqrt(ar * area_sqft) * 12;
            const chord_in = wing_area_sqin / wing_span_in;
            const wing_loading = w_oz / area_sqft;

            const fuse_length_in = wing_span_in * 0.7;
            const fuse_height_in = fuse_length_in * 0.1;

            const hs_area_sqin = wing_area_sqin * 0.3;
            const hs_length_in = wing_span_in / 2.1;
            const hs_width_in = hs_area_sqin / hs_length_in;

            const vs_area_sqin = hs_area_sqin * 0.5;
            const vs_width_in = hs_width_in;
            const vs_height_in = vs_area_sqin / vs_width_in;

            const aileron_length_in = wing_span_in * 0.3;
            const aileron_width_in = chord_in * 0.2;

            const rudder_height_in = vs_height_in;
            const rudder_width_in = vs_width_in * 0.35;

            const elevator_length_in = hs_length_in;
            const elevator_width_in = hs_width_in * 0.35;

            RCState.renderStats(document.getElementById('out'), {
                'Wing Area (sq in)': wing_area_sqin,
                'Wing Span (in)': wing_span_in,
                'Chord Length (in)': chord_in,
                'Wing loading (oz/sq ft)': wing_loading,
                'Fuselage Length (in)': fuse_length_in,
                'Fuselage Height (in)': fuse_height_in,
                'Width of Horiz. Stab (in)': hs_width_in,
                'Length of Horiz. Stab (in)': hs_length_in,
                'Area of Horiz. Stab (sq in)': hs_area_sqin,
                'Width of Vert. Stab (in)': vs_width_in,
                'Height of Vert. Stab (in)': vs_height_in,
                'Area of Vert. Stab (sq in)': vs_area_sqin,
                'Aileron Length (in)': aileron_length_in,
                'Aileron Width (in)': aileron_width_in,
                'Rudder Height (in)': rudder_height_in,
                'Rudder Width (in)': rudder_width_in,
                'Elevator Length (in)': elevator_length_in,
                'Elevator Width (in)': elevator_width_in
            });

            const span_cm = wing_span_in * 2.54;
            const meanChord_cm = chord_in * 2.54;
            const rootChord_cm = (2 * meanChord_cm) / (1 + taperRatio);
            const tipChord_cm = rootChord_cm * taperRatio;
            
            RCState.set({
                weight_g: w_g, 
                aspectRatio: ar, 
                wingCubicLoading: wcl, 
                taperRatio: taperRatio,
                span_cm: span_cm, 
                rootChord_cm: rootChord_cm, 
                tipChord_cm: tipChord_cm, 
                fuseLength_cm: fuse_length_in * 2.54, 
                fuseHeight_cm: fuse_height_in * 2.54,
                hsSpan_cm: hs_length_in * 2.54, 
                hsChord_cm: hs_width_in * 2.54, 
                vsHeight_cm: vs_height_in * 2.54, 
                vsChord_cm: vs_width_in * 2.54,
                fuselageLength_mm: (fuse_length_in * 2.54) * 10
            });
        }
        c();
    </script>
</body></html>
