<!DOCTYPE html>
<html><head><link rel="stylesheet" href="style.css"></head><body>
    <div class="nav">
        <a href="index.html" class="active">1. Sizer</a><a href="airfoil.html">2. Airfoil</a>
        <a href="electronics.html">3. Electronics</a><a href="cg.html">4. CG Analysis</a>
        <a href="gear.html">5. Landing Gear</a><a href="viewer.html">6. 3D Viewer</a>
    </div>
    <div class="grid"><div class="panel">
        <h3>Inputs</h3>
        <label>Weight (g)</label><input type="number" id="w" value="1500" oninput="c()">
        <label>Aspect Ratio</label><input type="number" id="ar" value="6" oninput="c()">
        <label>Wing Cubic Loading</label><input type="number" id="wcl" value="7" oninput="c()">
        <label>Taper Ratio</label><input type="number" id="tr" value="0.6" oninput="c()">
    </div>
    <div class="panel">
        <h3>Geometry</h3>
        <div class="stat-grid">
            <div class="stat-box">Area (dm²)<span id="o_a"></span></div>
            <div class="stat-box">Span (cm)<span id="o_s"></span></div>
            <div class="stat-box">Root Chord (cm)<span id="o_r"></span></div>
            <div class="stat-box">Tip Chord (cm)<span id="o_t"></span></div>
        </div>
    </div></div>
    <script>
        function c() {
            let w = document.getElementById('w').value/1000, ar = document.getElementById('ar').value, wcl = document.getElementById('wcl').value, tr = document.getElementById('tr').value;
            let area_dm = Math.pow((w*1000/wcl), 2/3);
            let span_cm = Math.sqrt(ar * area_dm) * 10;
            let chord = (area_dm*100) / span_cm;
            document.getElementById('o_a').innerText = area_dm.toFixed(1);
            document.getElementById('o_s').innerText = span_cm.toFixed(1);
            document.getElementById('o_r').innerText = ((2*chord)/(1+Number(tr))).toFixed(1);
            document.getElementById('o_t').innerText = (((2*chord)/(1+Number(tr)))*tr).toFixed(1);
        }
        c();
    </script>
</body></html>
